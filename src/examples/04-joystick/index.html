<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunanore Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 12pt;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info {
            position: absolute;
            left: 25%;
            top: 30%;
            width: 50%;
            height: 40%;
            background-color: #111;
            border: solid 1px #333;
            color: #fff;
            padding: 16px;
            display: block;
        }

        .info.disconnected {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
        }

        .info.connected {
            display: flex;
            flex-direction: row;
        }

        .info.connected .col {
            display: flex;
            flex: 1;
            flex-direction: column;
        }

        h2 {
            font-size: 1.3em;
            margin: 0 0 16px 0;
        }

        span {
            margin: 0 0 8px 0;
        }
    </style>
</head>

<body>
    <canvas></canvas>
    <div class="info"></div>
    <script src="index.ts" type="module"></script>
</body>

</html>
