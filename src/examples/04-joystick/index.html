<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunanore Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 12pt;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        h2 {
            font-size: 1.3em;
            margin: 0 0 16px 0;
        }

        span {
            margin: 0 0 8px 0;
        }

        #info {
            display: flex;
            flex-direction: row;
            width: 512px;
            height: 256px;
            padding: 16px;
            background-color: #111;
            border: solid 1px #222;
            position: absolute;
            left: calc(50% - 256px);
            top: calc(50% - 128px);
        }
    </style>
</head>

<body>
    <canvas></canvas>
    <div id="info"></div>
    <script src="index.ts" type="module"></script>
</body>

</html>
