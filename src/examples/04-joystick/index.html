<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunanore Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 12pt;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #info {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 32px;
            position: absolute;
            left: 0;
            top: 0;
            color: #fff;
            font-size: 1.5em;
        }

        h2 {
            font-size: 1.6em;
        }

        table {
            display: inline-block;
            width: 100%;
            margin: 32px 0 0 0;
            border-spacing: 0;
        }

        tr {
            width: 100%;
            background-color: #0a0a0a;
        }

        tr:nth-child(even) {
            background-color: #0c0c0c;
        }

        td {
            font-size: 1.3em;
            width: 100%;
            text-align: right;
            padding: 16px;
        }

        td:first-child {
            font-weight: bold;
            text-align: left;
        }

        .row {
            display: flex;
            flex-direction: row;
            flex: 1;
        }

        .col {
            flex: 1;
        }

        .col:first-child {
            margin-right: 32px;
        }

        .center {
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <canvas></canvas>
    <div id="info" class="center">
        Please connect a joystick. Or if you have one attached already please press a button or axis to wake it up in case it is in idle state.
    </div>
    <script src="index.ts" type="module"></script>
</body>

</html>
