<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunanore Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 12pt;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            position: absolute;
            right: 32px;
            top: 32px;
            width: 480px;
            padding: 16px;
            background-color: #111;
            border: solid 2px #222;
            color: #ffffff;
            opacity: 0.8;
            z-index: 100;
        }

        .row {
            flex: 1;
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .row:last-child > * {
            margin-bottom: 0;
        }

        select,
        input {
            flex: 1;
            padding: 4px;
            border: solid 1px #153a09;
            color: #153a09;
        }

        button {
            border: solid 1px #153a09;
            background: linear-gradient(#369118, #1b4b0b);
            color: #fff;
            padding: 8px;
            flex: 1;
            cursor: pointer;
            margin: 0 0 8px 0;
        }

        button:active {
            background: linear-gradient(#296e12, #0e2706);
        }

        button.cancel {
            filter: grayscale(1);
        }

        input[type="checkbox"] {
            flex: 0;
            margin: 8px 0;
        }

        label {
            min-width: 20%;
            margin: 0 16px 0 0;
        }

        hr {
            border: 0;
            border-top: solid 2px #153a09;
            margin: 16px 0;
        }
    </style>
</head>

<body>
    <script src="index.ts" type="module"></script>
    <form name="controls" action="#" onsubmit="return false;">
        <div class="row">
            <label>Animation: </label>
            <select name="animations"></select>
        </div>

        <div class="row">
            <label>Loop: </label>
            <input type="checkbox" name="loop" />
        </div>

        <hr />

        <div class="row">
            <button name="play">Play</button>
        </div>

        <div class="row">
            <button name="stop" class="cancel">Stop</button>
        </div>
    </form>
</body>

</html>
