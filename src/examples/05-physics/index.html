<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunanore Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 20pt;
            color: #fff;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #counter {
            display: block;
            position: absolute;
            top: 32px;
            left: 32px;

            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <canvas></canvas>
    <div id="counter"></div>

    <script src="index.ts" type="module"></script>
</body>

</html>
